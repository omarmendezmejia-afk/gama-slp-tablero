<!DOCTYPE html>
<html lang="es">
<head>
<script>if(localStorage.getItem("gama_qro_auth2")!=="1"){location.href="./index.html";}</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reporte Semanal — GAMA QRO</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --azul:#1A3C6E; --azul2:#2563EB; --verde:#16A34A; --rojo:#DC2626; --naranja:#EA580C;
    --cian:#0891B2; --morado:#7C3AED; --gris:#F1F5F9; --texto:#0F172A; --sub:#64748B; --borde:#E2E8F0;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Segoe UI', Arial, sans-serif; background:#F8FAFC; color:var(--texto); }
  .header { background:linear-gradient(135deg,#1A3C6E 0%,#2563EB 100%); color:#fff; padding:24px 40px 20px;
    display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap; }
  .header h1 { font-size:24px; font-weight:700; }
  .header h2 { font-size:13px; font-weight:400; opacity:.8; margin-top:4px; }
  .header .fecha { text-align:right; font-size:13px; opacity:.85; }
  .header .badge { background:rgba(255,255,255,.2); border-radius:20px; padding:4px 14px; font-size:12px;
    font-weight:600; letter-spacing:1px; margin-bottom:4px; display:inline-block; }
  .page { padding:24px 36px; max-width:1400px; margin:0 auto; }
  .section-title { font-size:12px; font-weight:700; letter-spacing:1.5px; color:var(--azul); text-transform:uppercase;
    margin:8px 0 14px; padding-left:12px; border-left:3px solid var(--azul2); }
  .kpi-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:16px; margin-bottom:20px; }
  .kpi { background:#fff; border-radius:12px; padding:18px 20px; box-shadow:0 1px 4px rgba(0,0,0,.06);
    border:1px solid var(--borde); position:relative; overflow:hidden; }
  .kpi::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; background:var(--c,var(--azul2)); }
  .kpi-label { font-size:11px; font-weight:600; color:var(--sub); text-transform:uppercase; letter-spacing:.8px; }
  .kpi-value { font-size:26px; font-weight:700; margin:6px 0 4px; color:var(--c,var(--azul2)); }
  .kpi-sub { font-size:12px; color:var(--sub); }
  .charts-2 { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:20px; }
  .charts-3 { display:grid; grid-template-columns:2fr 1fr; gap:20px; margin-bottom:20px; }
  .charts-2 > *, .charts-3 > * { min-width:0; }
  .card { background:#fff; border-radius:12px; padding:22px 24px; box-shadow:0 1px 4px rgba(0,0,0,.06); border:1px solid var(--borde); }
  .card h3 { font-size:12px; font-weight:700; color:var(--sub); text-transform:uppercase; letter-spacing:1px; margin-bottom:16px; }
  .chart-wrap { position:relative; height:240px; }
  .chart-wrap.tall { height:300px; }
  .tbl { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { background:var(--gris); color:var(--sub); font-size:11px; font-weight:700; text-transform:uppercase;
    letter-spacing:.8px; padding:10px 12px; text-align:left; white-space:nowrap; }
  td { padding:9px 12px; border-bottom:1px solid var(--borde); overflow-wrap:anywhere; }
  td.n, th.n { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  td.s { color:var(--sub); font-size:12px; }
  tr:last-child td { border-bottom:none; }
  tr.total td { font-weight:700; background:#F8FAFC; }
  tr.excl td { color:var(--sub); text-decoration:line-through; }
  .chip { font-size:11px; font-weight:600; padding:2px 8px; border-radius:10px; background:var(--gris); color:var(--azul); white-space:nowrap; }
  .bar { height:6px; background:var(--gris); border-radius:4px; overflow:hidden; min-width:60px; }
  .bar > i { display:block; height:100%; background:var(--verde); }
  .notas { background:#FFFBEB; border:1px solid #FDE68A; border-radius:12px; padding:16px 20px; margin-bottom:20px; font-size:13px; line-height:1.55; }
  .notas b { color:#92400E; } .notas ul { padding-left:18px; }
  .footer { text-align:center; font-size:12px; color:var(--sub); padding:20px; }
  @media (max-width:860px) {
    .header { padding:18px 16px; } .header h1 { font-size:19px; } .header .fecha { text-align:left; }
    .page { padding:16px; } .charts-2, .charts-3 { grid-template-columns:1fr; }
    .kpi-grid { grid-template-columns:repeat(2,1fr); gap:10px; } .kpi { padding:14px; } .kpi-value { font-size:20px; }
    .card { padding:16px; } td, th { padding:8px 6px; } .hide-m { display:none; }
  }
</style>
</head>
<body>
<div class="header">
  <div>
    <span class="badge">REPORTE SEMANAL</span>
    <h1>GAMA QRO — Reporte Semanal</h1>
    <h2>Querétaro · Ventas, cobranza y egresos</h2>
  </div>
  <div class="fecha" id="hdrFecha"></div>
</div>

<div class="page">
  <div class="section-title">Resumen del mes</div>
  <div class="kpi-grid" id="kpis"></div>

  <div class="charts-3">
    <div class="card"><h3>Ventas por origen</h3><div class="chart-wrap"><canvas id="chOrigen"></canvas></div></div>
    <div class="card"><h3>Mezcla por línea de negocio</h3><div class="chart-wrap"><canvas id="chLinea"></canvas></div></div>
  </div>

  <div class="section-title">Cobranza</div>
  <div class="charts-3">
    <div class="card"><h3>Cobrado vs por cobrar</h3><div class="tbl"><table id="tCobranza"></table></div></div>
    <div class="card"><h3>Servicios por forma de pago</h3><div class="chart-wrap"><canvas id="chMet"></canvas></div></div>
  </div>

  <div id="secEg"><div class="section-title">Egresos (cargos BBVA)</div>
  <div class="charts-3">
    <div class="card"><h3>Movimientos de cargo</h3><div class="tbl"><table id="tCargos"></table></div></div>
    <div class="card"><h3>Egresos por categoría</h3><div class="chart-wrap tall"><canvas id="chEg"></canvas></div>
      <div id="egRes" style="margin-top:14px;font-size:13px;line-height:1.7"></div></div>
  </div></div>

  <div class="section-title">Notas de la semana</div>
  <div class="notas" id="notas"></div>
</div>
<div class="footer" id="footer"></div>

<script>
const D = {"mes": "Noviembre 2026", "corte": "2026-11-13", "generado": "2026-11-14", "periodo": {"desde": "2026-10-25", "hasta": "2026-11-24"}, "total": {"ventas": 1103618.33, "pagado": 397310.0, "parcial": 0.0, "pendiente": 706308.33, "registros": 245}, "ticket": 4504.56, "lineas": {"Servicios": {"ventas": 676735.0, "pagado": 237950.0, "parcial": 0.0, "pendiente": 438785.0, "registros": 116}, "Sanitarios": {"ventas": 426883.33, "pagado": 159360.0, "parcial": 0.0, "pendiente": 267523.33, "registros": 129}}, "origenes": [{"origen": "Servicios", "linea": "Servicios", "ventas": 527885.0}, {"origen": "Marco Guerrero", "linea": "Servicios", "ventas": 11800.0}, {"origen": "Krispy Kreme", "linea": "Servicios", "ventas": 70550.0}, {"origen": "HEB", "linea": "Servicios", "ventas": 66500.0}, {"origen": "Sanitarios", "linea": "Sanitarios", "ventas": 298710.0, "pagado": 157490.0, "pendiente": 141220.0, "registros": 91}, {"origen": "VYNMSA", "linea": "Sanitarios", "ventas": 3740.0, "pagado": 1870.0, "pendiente": 1870.0, "registros": 2}, {"origen": "Paul (HR2)", "linea": "Sanitarios", "ventas": 124433.33, "pagado": 0.0, "pendiente": 124433.33, "registros": 36}], "metodo": {"FISCAL": {"importe": 639735.0, "servicios": 102}, "EFECTIVO": {"importe": 14200.0, "servicios": 5}, "BBVA": {"importe": 22800.0, "servicios": 9}}, "banco": null, "notas": ["Ventas tomadas de la primera hoja (resumen) de cada archivo: servicios y sanitarios. No hay detalle por cliente ni por semana.", "Esta semana no se recibió estado de cuenta BBVA, así que el reporte no trae egresos."], "avisos": []};
const $ = id => document.getElementById(id);
const mx = v => '$' + Math.round(v).toLocaleString('es-MX');
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const MES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const fd = s => { if (!s) return '—'; const [y, m, d] = s.split('-'); return `${+d} ${MES[m-1]} ${y}`; };
const C = { azul:'#2563EB', azulO:'#1A3C6E', verde:'#16A34A', rojo:'#DC2626', naranja:'#EA580C', cian:'#0891B2', morado:'#7C3AED', gris:'#94A3B8' };
const PAL = [C.azul, C.naranja, C.verde, C.morado, C.cian, C.rojo, C.azulO, C.gris];
Chart.defaults.font.family = "'Segoe UI', Arial, sans-serif"; Chart.defaults.color = '#64748B';
const money = { callback: v => '$' + (v >= 1000 ? Math.round(v / 1000) + 'k' : v) };
const tipMoney = { callbacks: { label: c => `${c.dataset.label || c.label}: ${mx(c.raw)}` } };

const T = D.total, B = D.banco;
$('hdrFecha').innerHTML = `<div style="font-size:15px;font-weight:700">${D.mes}</div>Corte al ${fd(D.corte)}<br>Mes comercial: ${fd(D.periodo.desde)} al ${fd(D.periodo.hasta)}`;
$('footer').textContent = `Reporte Semanal (viernes 6 pm) · GAMA QRO · Datos: resumen de ventas de servicios y sanitarios ${B ? '+ cargos del estado de cuenta BBVA ' : ''}· Corte al ${fd(D.corte)}`;

const kpis = [
  ['Ventas del mes', mx(T.ventas), `${T.registros} servicios / rentas`, C.azul],
  ['Cobrado', mx(T.pagado), `${pct(T.pagado, T.ventas)}% de lo vendido`, C.verde],
  ['Por cobrar', mx(T.pendiente + T.parcial), `${pct(T.pendiente + T.parcial, T.ventas)}% de lo vendido`, C.naranja],
  B ? ['Egresos', mx(B.egresos), `cargos BBVA ${fd(B.desde).slice(0, -5)} – ${fd(B.hasta).slice(0, -5)}`, C.rojo]
    : ['Egresos', '—', 'sin estado de cuenta BBVA esta semana', C.gris],
  ['Ticket promedio', mx(D.ticket), 'por servicio / renta', C.morado],
];
$('kpis').innerHTML = kpis.map(([l, v, s, c]) => `<div class="kpi" style="--c:${c}"><div class="kpi-label">${l}</div><div class="kpi-value">${v}</div><div class="kpi-sub">${s}</div></div>`).join('');

const O = D.origenes;
new Chart($('chOrigen'), { type:'bar', data:{ labels:O.map(o => o.origen),
  datasets:[{ label:'Ventas', data:O.map(o => o.ventas), backgroundColor:O.map(o => o.linea === 'Servicios' ? C.azul : C.naranja), borderRadius:4 }] },
  options:{ maintainAspectRatio:false, plugins:{ legend:{ display:false }, tooltip:tipMoney },
    scales:{ x:{ grid:{ display:false } }, y:{ ticks:money } } } });

const L = Object.entries(D.lineas);
new Chart($('chLinea'), { type:'doughnut', data:{ labels:L.map(x => x[0]), datasets:[{ data:L.map(x => x[1].ventas), backgroundColor:[C.azul, C.naranja], borderWidth:0 }] },
  options:{ maintainAspectRatio:false, cutout:'62%', plugins:{ legend:{ position:'bottom', labels:{ generateLabels: () => L.map((x, i) => ({ text:`${x[0]} ${pct(x[1].ventas, T.ventas)}% · ${mx(x[1].ventas)}`, fillStyle:[C.azul, C.naranja][i], strokeStyle:'transparent' })) } }, tooltip:tipMoney } } });

const fila = (n, v, cls = '') => `<tr class="${cls}"><td>${n}</td><td class="n">${mx(v.ventas)}</td><td class="n">${mx(v.pagado)}</td><td class="n">${mx(v.pendiente + (v.parcial || 0))}</td><td class="n hide-m">${v.registros ?? '—'}</td><td class="hide-m"><div style="display:flex;gap:8px;align-items:center"><div class="bar" style="flex:1"><i style="width:${pct(v.pagado, v.ventas)}%"></i></div><span style="font-size:12px;color:#64748B">${pct(v.pagado, v.ventas)}%</span></div></td></tr>`;
$('tCobranza').innerHTML = `<tr><th>Línea / origen</th><th class="n">Ventas</th><th class="n">Cobrado</th><th class="n">Por cobrar</th><th class="n hide-m">Registros</th><th class="hide-m">% cobrado</th></tr>` +
  fila('<b>Servicios</b>', D.lineas.Servicios) +
  fila('<b>Sanitarios</b>', D.lineas.Sanitarios) +
  O.filter(o => o.linea === 'Sanitarios').map(o => fila('&nbsp;&nbsp;&nbsp;' + o.origen, o)).join('') +
  fila('Total', T, 'total');

const M = Object.entries(D.metodo);
new Chart($('chMet'), { type:'doughnut', data:{ labels:M.map(x => x[0][0] + x[0].slice(1).toLowerCase()), datasets:[{ data:M.map(x => x[1].importe), backgroundColor:PAL, borderWidth:0 }] },
  options:{ maintainAspectRatio:false, cutout:'60%', plugins:{ legend:{ position:'bottom' }, tooltip:tipMoney } } });

if (B) {
const E = Object.entries(B.categorias);
new Chart($('chEg'), { type:'bar', data:{ labels:E.map(x => x[0]), datasets:[{ label:'Egresos', data:E.map(x => x[1].importe), backgroundColor:C.rojo, borderRadius:3 }] },
  options:{ indexAxis:'y', maintainAspectRatio:false, plugins:{ legend:{ display:false }, tooltip:tipMoney },
    scales:{ x:{ ticks:money }, y:{ grid:{ display:false }, ticks:{ font:{ size:11 } } } } } });
$('egRes').innerHTML = `<b>Total egresos: ${mx(B.egresos)}</b>` +
  (B.traspasos ? `<br><span style="color:#64748B">Incluye traspasos a cuenta propia: ${mx(B.traspasos)}</span>` : '') +
  (B.saldo_final != null ? `<br><span style="color:#64748B">Saldo BBVA al ${fd(B.hasta)}: ${mx(B.saldo_final)}</span>` : '');
const corto = s => s.replace(/\/\s*\d{6,}.*$/, '').replace(/\s+\d{3}$/, '');
$('tCargos').innerHTML = `<tr><th>Fecha</th><th>Concepto</th><th class="hide-m">Categoría</th><th class="n">Cargo</th></tr>` +
  B.detalle.map(m => `<tr><td class="s">${m.fecha}</td><td>${corto(m.concepto)}<div class="s">${m.referencia.replace(/^\d{7}/, '')}</div></td><td class="hide-m"><span class="chip">${m.categoria}</span></td><td class="n">${mx(m.monto)}</td></tr>`).join('') +
  `<tr class="total"><td></td><td>Total egresos</td><td class="hide-m"></td><td class="n">${mx(B.egresos)}</td></tr>`;
} else $('secEg').style.display = 'none';

const notas = [...(D.notas || []), ...(D.avisos || [])];
$('notas').innerHTML = `<b>Para leer este reporte</b><ul>${notas.map(n => `<li>${n}</li>`).join('')}</ul>`;
</script>
</body>
</html>
